# docker compose up             -> the whole stack, gateway on http://localhost:8080
# docker compose --profile tunnel up   -> plus a Cloudflare named tunnel (set CLOUDFLARE_TUNNEL_TOKEN in .env)
services:
  app:
    build: .
    env_file: .env
    environment:
      # inside the container the services reach each other on localhost
      REGISTRY_URL: http://localhost:4000
    ports:
      - "8080:8080"
    volumes:
      - ./.data:/app/.data
    restart: unless-stopped

  # A token-managed Cloudflare tunnel: in the Cloudflare dashboard, give your public hostname the
  # service http://app:8080. Pin CLOUDFLARED_IMAGE to a specific release for repeatable deploys.
  tunnel:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:latest}
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app
    restart: unless-stopped
